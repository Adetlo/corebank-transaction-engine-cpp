name: Feature request
description: Propose a new control, capability or operational tool.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which banking or engineering scenario is not covered today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What should the engine, CLI, batch or scripts do? Mention affected invariants, locking order or audit events.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
