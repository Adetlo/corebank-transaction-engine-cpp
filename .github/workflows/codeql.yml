name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze C++
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libsqlite3-dev
      - uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCOREBANK_BUILD_TESTS=OFF
          cmake --build build --parallel
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:c-cpp"
