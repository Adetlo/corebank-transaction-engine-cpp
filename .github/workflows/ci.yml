name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_GENERATOR: Ninja

jobs:
  build-test:
    name: Build and test (${{ matrix.compiler }}, ${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
            build_type: Release
          - compiler: clang
            cc: clang
            cxx: clang++
            build_type: Debug
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libsqlite3-dev sqlite3
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build --parallel
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure -L '^unit$'
      - name: Integration, batch, messaging, property, CLI tests
        run: ctest --test-dir build --output-on-failure -L '^(integration|batch|messaging|property|cli)$'
      - name: Concurrency tests
        run: ctest --test-dir build --output-on-failure -L '^concurrency$'
      - name: Shell smoke test
        run: scripts/smoke_test.sh

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format 18
        run: pipx install clang-format==18.1.8
      - name: Check formatting
        run: |
          find src include tests -name '*.cpp' -o -name '*.hpp' | xargs clang-format --dry-run --Werror
